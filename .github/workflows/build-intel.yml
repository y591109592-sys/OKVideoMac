name: Build Intel macOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Build Application for Intel (x86_64)
        run: |
          # 1. 自动定位工程路径
          PROJ_FILE=$(find . -name "*.xcodeproj" -o -name "*.xcworkspace" | head -n 1)
          if [ -z "$PROJ_FILE" ]; then
            echo "Error: No Xcode project or workspace found!"
            exit 1
          fi
          echo "Found project file: $PROJ_FILE"
          cd "$(dirname "$PROJ_FILE")"
          PROJ_NAME="$(basename "$PROJ_FILE")"

          # 2. 交叉编译并显式链接系统 libsqlite3
          BUILD_CMD=(
            -scheme OKVideoMac
            -configuration Release
            -arch x86_64
            ARCHS=x86_64
            ONLY_ACTIVE_ARCH=NO
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=""
            OTHER_LDFLAGS='$(inherited) -lsqlite3'
            build
          )

          if [[ "$PROJ_NAME" == *.xcworkspace ]]; then
            xcodebuild -workspace "$PROJ_NAME" "${BUILD_CMD[@]}"
          else
            xcodebuild -project "$PROJ_NAME" "${BUILD_CMD[@]}"
          fi

      - name: Package App
        run: |
          mkdir -p output
          # 自动定位生成的 .app 并打包
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "OKVideoMac.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "Found app at: $APP_PATH"
            cd "$(dirname "$APP_PATH")"
            zip -r -y "$GITHUB_WORKSPACE/output/OKVideoMac-Intel-x86_64.zip" "$(basename "$APP_PATH")"
          else
            echo "Error: OKVideoMac.app not found!"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKVideoMac-Intel-x86_64
          path: output/OKVideoMac-Intel-x86_64.zip
