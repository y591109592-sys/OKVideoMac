name: Build Intel macOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Build Application for Intel (x86_64)
        run: |
          # 交叉编译生成 Intel 架构切片
          xcodebuild -scheme OKVideoMac \
                     -configuration Release \
                     -destination "generic/platform=macOS" \
                     -arch x86_64 \
                     ONLY_ACTIVE_ARCH=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Package App
        run: |
          mkdir -p output
          # 自动定位生成的 OKVideoMac.app 路径并打包
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "OKVideoMac.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "Found app at: $APP_PATH"
            cd "$(dirname "$APP_PATH")"
            zip -r -y "$GITHUB_WORKSPACE/output/OKVideoMac-Intel-x86_64.zip" "$(basename "$APP_PATH")"
          else
            echo "Error: OKVideoMac.app not found!"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKVideoMac-Intel-x86_64
          path: output/OKVideoMac-Intel-x86_64.zip
