name: Build Intel macOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13 # macos-13 运行在原生 Intel (x86_64) 环境上
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install mpv

      - name: Build Application
        run: |
          xcodebuild -project OKVideoMac.xcodeproj \
                     -scheme OKVideoMac \
                     -configuration Release \
                     -arch x86_64 \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Package App
        run: |
          mkdir -p output
          cd ~/Library/Developer/Xcode/DerivedData/OKVideoMac-*/Build/Products/Release/
          zip -r -y "$GITHUB_WORKSPACE/output/OKVideoMac-Intel-x86_64.zip" OKVideoMac.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OKVideoMac-Intel-x86_64
          path: output/OKVideoMac-Intel-x86_64.zip
