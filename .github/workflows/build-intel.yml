name: Build Intel macOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Inspect Dependencies & Patch Project
        run: |
          # 1. 扫描仓库内置预编译库的架构切片
          echo "=== Scanning Binary Architectures in Repository ==="
          find . -type f \( -name "*.dylib" -o -name "*.a" -o -name "*.framework" \) -exec lipo -info {} + 2>/dev/null || true

          # 2. 深度修补工程文件，将 -lsqlite3 强行注入所有 Target 的底层 buildSettings
          python3 - << 'EOF'
          import glob

          for pbx in glob.glob("**/*.xcodeproj/project.pbxproj", recursive=True):
              print(f"Patching {pbx}...")
              with open(pbx, "r", encoding="utf-8") as f:
                  lines = f.readlines()

              new_lines = []
              inside_build_settings = False
              has_other_ldflags = False

              for line in lines:
                  if "buildSettings = {" in line:
                      inside_build_settings = True
                      has_other_ldflags = False
                      new_lines.append(line)
                      continue

                  if inside_build_settings:
                      if "OTHER_LDFLAGS" in line:
                          has_other_ldflags = True
                          if "(" in line:
                              new_lines.append(line)
                              new_lines.append('\t\t\t\t"-lsqlite3",\n')
                              continue
                          elif '"' in line:
                              line = line.replace('";', ' -lsqlite3";')
                              new_lines.append(line)
                              continue
                      elif line.strip() == "};":
                          if not has_other_ldflags:
                              new_lines.append('\t\t\t\tOTHER_LDFLAGS = ("$(inherited)", "-lsqlite3");\n')
                          inside_build_settings = False

                  new_lines.append(line)

              with open(pbx, "w", encoding="utf-8") as f:
                  f.writelines(new_lines)
              print(f"Successfully patched {pbx}")
          EOF

      - name: Build Application for Intel (x86_64)
        run: |
          PROJ_FILE=$(find . -name "*.xcodeproj" -o -name "*.xcworkspace" | head -n 1)
          if [ -z "$PROJ_FILE" ]; then
            echo "Error: No Xcode project found!"
            exit 1
          fi
          cd "$(dirname "$PROJ_FILE")"
          PROJ_NAME="$(basename "$PROJ_FILE")"

          # 3. 执行编译（由修改后的 project.pbxproj 自带 -lsqlite3 链接参数）
          set -o pipefail
          xcodebuild -project "$PROJ_NAME" \
                     -scheme OKVideoMac \
                     -configuration Release \
                     -arch x86_64 \
                     ARCHS=x86_64 \
                     ONLY_ACTIVE_ARCH=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     build 2>&1 | tee xcodebuild.log

      - name: Package App
        if: success()
        run: |
          mkdir -p output
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "OKVideoMac.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            echo "Found app at: $APP_PATH"
            cd "$(dirname "$APP_PATH")"
            zip -r -y "$GITHUB_WORKSPACE/output/OKVideoMac-Intel-x86_64.zip" "$(basename "$APP_PATH")"
          else
            echo "Error: OKVideoMac.app not found!"
            exit 1
          fi

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OKVideoMac-Intel-x86_64
          path: output/OKVideoMac-Intel-x86_64.zip
